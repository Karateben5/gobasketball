<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Hub (Live)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#667085;--bd:#e3e6eb;--ac:#c8102e;--lv:#16a34a;--up:#16a34a;--dn:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eef0f3;--mu:#9aa3b2;--bd:#262c36;--ac:#ff4d5e;--up:#34d399;--dn:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header,main,nav{max-width:760px;margin:auto;padding-left:16px;padding-right:16px}
header{padding-top:20px}h1{margin:0;font-size:26px}h1 span{color:var(--ac)}
.sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer;white-space:nowrap}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding-bottom:40px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 0 8px}
.bar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.g,.n,.note{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.note{border-style:dashed;color:var(--mu);font-size:13px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:8px;font-weight:600}.tm img{width:26px;height:26px}
.sc{font-size:20px;font-weight:700}.lose{opacity:.55}
.p{color:var(--mu);font-size:13px}.live{color:var(--lv);font-weight:700}
.ld{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mu)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu)}tr:last-child td{border:0}
.n{display:flex;gap:12px;color:inherit;text-decoration:none}.n img{width:96px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.n b{display:block}.n span{color:var(--mu);font-size:13px}
#stock .tools{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
#stock input,#stock select,#stock button{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
#stock input{flex:1;min-width:140px}#stock button{cursor:pointer}
#stock .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
#stock .note{color:var(--mu);font-size:13px}#stock .up{color:var(--up)}#stock .dn{color:var(--dn)}
#stock .row{display:grid;grid-template-columns:28px 1fr 70px 70px 90px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
#stock .row:last-child{border:0}#stock .row:hover{background:var(--bg)}
#stock .p{display:flex;align-items:center;gap:8px;min-width:0}#stock .p img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bd)}
#stock .p b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#stock .p span{color:var(--mu);font-size:12px}
#stock .v{font-weight:700;text-align:right}#stock .big{font-size:30px;font-weight:800}
#stock .list{padding:0;overflow:hidden}
#stock .log{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
#stock .p{color:var(--tx);font-size:15px}
@media(max-width:520px){#stock .row{grid-template-columns:22px 1fr 60px 60px}#stock .row svg{display:none}}
</style></head><body>
<header><h1>NBA <span>Hub</span></h1><div class="sub" id="upd">Loading…</div></header>
<nav id="nav"></nav><main id="m"></main>
<template id="stock-tpl"><div class="sub" id="st">Every player starts at 0. Great games add points, bad games subtract them.</div><div class="tools"><input id="q" placeholder="Search players or teams" oninput="stockDraw()">
<select id="so" onchange="stockDraw()"><option value="v">Highest value</option><option value="l">Lowest value</option><option value="u">Last game: biggest gain</option><option value="d">Last game: biggest drop</option></select>
<button id="dm" onclick="stockDemo()">Demo data</button></div><div id="det"></div><div class="card list" id="ls"></div>
<p class="note">Game points = (Game Score − 8) per game, where Game Score is John Hollinger's box-score formula (points, shooting efficiency, rebounds, assists, steals, blocks, minus turnovers and fouls). A typical rotation player lands near 0, stars climb, and bad nights drop. Change BASE in the code to adjust. Players who do not play are skipped.</p></template>
<script>(function(){
const API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba",START="20261020",KEY="nbaStockV1",BASE=8;
let S={games:{},players:{}},sel=null,isDemo=false;
try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const $=id=>document.getElementById(id),st=t=>{const e=$("st");if(e)e.textContent=t};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const save=()=>{if(!isDemo)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}

function proc(id,date,d){S.games[id]=1;
for(const tm of d.boxscore?.players||[]){const ab=tm.team?.abbreviation,s=tm.statistics?.[0];if(!s)continue;const L=s.labels;
for(const a of s.athletes||[]){if(a.didNotPlay||!a.stats?.length)continue;
const g=k=>{const i=L.indexOf(k);return i<0?0:parseFloat(a.stats[i])||0};
const sp=k=>{const i=L.indexOf(k);return i<0?[0,0]:String(a.stats[i]).split("-").map(Number)};
if(g("MIN")<1)continue;const[fm,fa]=sp("FG"),[tmk,ta]=sp("FT");
const gs=g("PTS")+.4*fm-.7*fa-.4*(ta-tmk)+.7*g("OREB")+.3*g("DREB")+g("STL")+.7*g("AST")+.7*g("BLK")-.4*g("PF")-g("TO");
const id2=a.athlete.id,p=S.players[id2]??={n:a.athlete.displayName,t:ab,h:a.athlete.headshot?.href||"",g:[]};
p.t=ab;p.g.push([date,Math.round((gs-BASE)*10)/10,`${g("PTS")} pts, ${g("REB")} reb, ${g("AST")} ast`])}}}

async function load(){const end=ymd(new Date());
if(end<START){st("The season starts Oct 20, so everyone is at 0. Try Demo data to preview.");return}
try{const d=await j(`${API}/scoreboard?dates=${START}-${end}&limit=1000`);
const todo=(d.events||[]).filter(e=>e.status.type.completed&&!S.games[e.id]).sort((a,b)=>a.date<b.date?-1:1);
if(!todo.length)st("Up to date. "+Object.keys(S.games).length+" games counted.");
for(let i=0;i<todo.length;i+=6){await Promise.all(todo.slice(i,i+6).map(async e=>{try{proc(e.id,e.date,await j(`${API}/summary?event=${e.id}`))}catch(x){}}));
save();draw();st(`Loading games: ${Math.min(i+6,todo.length)} of ${todo.length} new`)}
if(todo.length)st(Object.keys(S.games).length+" games counted.")}catch(x){st("Could not reach ESPN. Showing saved data.")}}

function series(p){p.g.sort((a,b)=>a[0]<b[0]?-1:1);let c=0;return[0,...p.g.map(x=>c+=x[1])]}
function chart(v,w,h,big){const mn=Math.min(0,...v),mx=Math.max(0,...v),r=(mx-mn)||1,pd=big?30:2;
const X=i=>pd+i*(w-2*pd)/Math.max(v.length-1,1),Y=y=>h-pd/1.5-(y-mn)/r*(h-pd*1.5),c=v[v.length-1]>=0?"var(--up)":"var(--dn)";
let s=`<svg viewBox="0 0 ${w} ${h}" ${big?'style="width:100%"':`width="${w}" height="${h}"`}><line x1="${pd}" x2="${w-pd}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)" stroke-dasharray="4"/>`;
if(big)s+=`<text x="2" y="${Y(mx)+4}" fill="var(--mu)" font-size="11">${mx.toFixed(0)}</text><text x="2" y="${Y(mn)}" fill="var(--mu)" font-size="11">${mn.toFixed(0)}</text>`;
s+=`<polyline fill="none" stroke="${c}" stroke-width="${big?2.5:1.5}" stroke-linejoin="round" points="${v.map((y,i)=>X(i)+","+Y(y)).join(" ")}"/>`;
if(big)s+=v.map((y,i)=>`<circle cx="${X(i)}" cy="${Y(y)}" r="4" fill="${c}"><title>${i?"Game "+i:"Start"}: ${y.toFixed(1)}</title></circle>`).join("");
return s+"</svg>"}
const f=n=>(n>0?"+":"")+n.toFixed(1),cl=n=>n>=0?"up":"dn";

function draw(){if(!$("ls"))return;const q=$("q").value.toLowerCase(),so=$("so").value;
let A=Object.entries(S.players).map(([id,p])=>{const v=series(p);return{id,p,v,val:v[v.length-1],last:p.g.length?p.g[p.g.length-1][1]:0}})
.filter(x=>(x.p.n+" "+x.p.t).toLowerCase().includes(q));
A.sort({v:(a,b)=>b.val-a.val,l:(a,b)=>a.val-b.val,u:(a,b)=>b.last-a.last,d:(a,b)=>a.last-b.last}[so]);
$("ls").innerHTML=A.length?A.slice(0,100).map((x,i)=>`<div class="row" onclick="stockPick('${esc(x.id)}')"><span class="note">${i+1}</span>
<div class="p"><img src="${esc(x.p.h)}" alt="" onerror="this.style.visibility='hidden'"><div style="min-width:0"><b>${esc(x.p.n)}</b><span>${esc(x.p.t)} · ${x.p.g.length} GP</span></div></div>
<div class="v">${x.val.toFixed(1)}</div><div class="v ${cl(x.last)}">${x.p.g.length?(x.last>=0?"▲ ":"▼ ")+Math.abs(x.last).toFixed(1):"–"}</div>${chart(x.v,90,28)}</div>`).join("")
:`<div class="card note" style="margin:0">No players yet. Games will appear after the season starts, or click Demo data.</div>`;
const p=S.players[sel];if(!p){$("det").innerHTML="";return}
const v=series(p),val=v[v.length-1];
$("det").innerHTML=`<div class="card"><div class="p" style="justify-content:space-between"><div class="p"><img src="${esc(p.h)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(p.n)}</b><span>${esc(p.t)} · ${p.g.length} games</span></div></div>
<div style="text-align:right"><div class="big ${cl(val)}">${val.toFixed(1)}</div><button onclick="stockPick(null)">Close</button></div></div>
${chart(v,640,240,1)}<div style="margin-top:8px">${p.g.slice(-8).reverse().map(x=>`<div class="log"><span>${new Date(x[0]).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · ${esc(x[2])}</span><b class="${cl(x[1])}">${f(x[1])}</b></div>`).join("")}</div></div>`}

function demo(){if(isDemo){isDemo=false;try{S=JSON.parse(localStorage.getItem(KEY))||{games:{},players:{}}}catch(e){S={games:{},players:{}}}$("dm").textContent="Demo data";st("");sel=null;draw();load();return}
isDemo=true;$("dm").textContent="Exit demo";st("DEMO DATA: made-up players for previewing the charts.");
const N=["Alex Rivers","Jordan Hale","Sam Okafor","Chris Dunn","Mika Torres","Devin Park","Leo Banks","Ray Cole","Tyrese Vale","Omar Reed","Kai Stone","Jules Mercer"],T=["BOS","LAL","DEN","MIA","OKC","NYK"];
S={games:{},players:{}};N.forEach((n,i)=>{const drift=(Math.random()-.4)*3,g=[];
for(let k=0;k<25;k++)g.push([new Date(2026,9,20+k*2).toISOString(),Math.round((drift+(Math.random()-.5)*18)*10)/10,"demo game"]);
S.players["d"+i]={n,t:T[i%6],h:"",g}});sel=null;draw()}
let busy=false;const _l=load;load=async()=>{if(busy)return;busy=true;try{await _l()}finally{busy=false}};
window.stockPick=id=>{sel=id;draw();if(id)scrollTo(0,0)};window.stockDraw=draw;window.stockDemo=demo;
window.stockMount=()=>{if(isDemo){$("dm").textContent="Exit demo";st("DEMO DATA: made-up players for previewing the charts.")}draw();if(!isDemo)load()};
setInterval(()=>{if(!isDemo&&$("ls"))load()},300000);
})();</script>
<script>
const API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const STAND="https://site.api.espn.com/apis/v2/sports/basketball/nba/standings";
const TABS=["Scores","Standings","News","Top Performers","Stock Market"];const H=t=>t.replace(/\W/g,"").toLowerCase();
let tab=Math.max(0,TABS.findIndex(t=>H(t)===H(location.hash.slice(1)))),date=new Date(),anyLive=false,cache=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
const err=()=>'<div class="note">Could not load data right now. Try again in a moment.</div>';
const dayNav=()=>`<div class="bar"><button onclick="shift(-1)">← Prev</button><b>${date.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</b><button onclick="shift(1)">Next →</button></div>`;
function shift(n){date=new Date(date.getTime()+n*864e5);render()}

async function games(){const d=await j(`${API}/scoreboard?dates=${ymd(date)}`);cache=d.events||[];
anyLive=cache.some(e=>e.status.type.state==="in");return cache}

function card(e){const c=e.competitions[0],st=e.status.type,[a,h]=["away","home"].map(k=>c.competitors.find(t=>t.homeAway===k));
const row=t=>`<div class="r ${st.state==="post"&&!t.winner?"lose":""}"><span class="tm"><img src="${esc(t.team.logo)}" alt="">${esc(t.team.displayName)} <span class="p">${esc(t.records?.[0]?.summary||"")}</span></span><span class="sc">${st.state==="pre"?"":esc(t.score)}</span></div>`;
const time=st.state==="pre"?new Date(e.date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):st.shortDetail;
return `<div class="g">${row(a)}${row(h)}<div class="p ${st.state==="in"?"live":""}" style="margin-top:6px">${st.state==="in"?"● ":""}${esc(time)}</div></div>`}

async function vScores(){const g=await games();return dayNav()+(g.length?g.map(card).join(""):'<div class="note">No games on this date. Use the arrows to browse other days.</div>')}

async function vStand(){const d=await j(STAND);return (d.children||[]).map(cf=>{
const es=cf.standings.entries,v=(e,n)=>(e.stats.find(s=>s.name===n)||{}).displayValue??"-";
return `<h2>${esc(cf.name)}</h2><div class="tbl"><table><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th></tr>`+
es.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.team.displayName)}</td><td>${v(e,"wins")}</td><td>${v(e,"losses")}</td><td>${v(e,"winPercent")}</td><td>${v(e,"gamesBehind")}</td></tr>`).join("")+"</table></div>"}).join("")||err()}

async function vNews(){const d=await j(`${API}/news`);return (d.articles||[]).map(a=>`<a class="n" href="${esc(a.links?.web?.href)}" target="_blank" rel="noopener">${a.images?.[0]?`<img src="${esc(a.images[0].url)}" alt="">`:""}<div><b>${esc(a.headline)}</b><span>${esc(a.description||"")}</span></div></a>`).join("")||err()}

async function vPerf(){const g=await games();const out=[];
g.forEach(e=>e.competitions[0].competitors.forEach(t=>(t.leaders||[]).forEach(l=>{const x=l.leaders?.[0];
if(x)out.push(`<tr><td>${esc(x.athlete.displayName)}</td><td>${esc(t.team.abbreviation)}</td><td>${esc(l.displayName||l.name)}</td><td>${esc(x.displayValue)}</td></tr>`)})));
return dayNav()+(out.length?`<div class="tbl"><table><tr><th>Player</th><th>Team</th><th>Category</th><th>Stat</th></tr>${out.join("")}</table></div>`:'<div class="note">No game leaders for this date yet.</div>')}

const vStock=()=>'<div id="stock">'+document.getElementById("stock-tpl").innerHTML+'</div>';
function go(i){tab=i;location.hash=H(TABS[i]);render()}
const V=[vScores,vStand,vNews,vPerf,vStock];
async function render(){$("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})">${t}</button>`).join("");
try{$("m").innerHTML=await V[tab]();if(tab===4&&window.stockMount)stockMount();$("upd").textContent="Updated "+new Date().toLocaleTimeString()}catch(x){$("m").innerHTML=err()}}
render();
setInterval(()=>{if(tab===0||tab===3){if(anyLive||ymd(date)===ymd(new Date()))render()}},30000);
</script></body></html>
